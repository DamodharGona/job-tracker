services:
  job-tracker-db:
    image: postgres:16
    container_name: job-tracker-db
    restart: always
    environment:
      POSTGRES_USER: job-tracker
      POSTGRES_PASSWORD: job-tracker-secret
      POSTGRES_DB: job-tracker-dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
